name: Deploy to GitHub Pages

# main 에 push 되면 빌드 후 gh-pages 브랜치로 배포 (수동 실행도 가능)
on:
  push:
    branches: [main]
  workflow_dispatch:

# 동시에 여러 배포가 겹치지 않도록 (최신 것만 실행)
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # peaceiris 가 gh-pages 브랜치에 push 하려면 필요
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # 브라우저 번들에 들어가는 키. 저장소에 평문 커밋을 피하려고 Secret 으로 주입.
          VITE_KAKAO_KEY: ${{ secrets.VITE_KAKAO_KEY }}

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
